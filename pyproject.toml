[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dealerai-ops"
version = "0.1.0"
description = "Production-grade agentic AI and predictive intelligence platform for automotive dealerships."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DealerAI Ops" }
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "joblib>=1.4,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "structlog>=24.1,<26.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
observability = [
  "mlflow>=2.14,<4.0"
]
ui = [
  "streamlit>=1.37,<2.0"
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "streamlit>=1.37,<2.0"
]

[project.scripts]
dealerai-seed = "dealerai_ops.scripts.seed_synthetic_data:main"
dealerai-train-no-show = "dealerai_ops.scripts.train_no_show_model:main"
dealerai-evaluate = "dealerai_ops.evals.runner:main"
dealerai-gate = "dealerai_ops.evals.gate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dealerai_ops", "src/evaluation"]

[tool.pytest.ini_options]
addopts = "-q --cov=dealerai_ops --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["work", "outputs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = [
  "S101"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
pretty = true
packages = ["dealerai_ops", "evaluation"]

[[tool.mypy.overrides]]
module = [
  "joblib",
  "numpy.*",
  "pandas.*",
  "sklearn.*"
]
ignore_missing_imports = true
