services:
  api:
    build:
      context: .
    environment:
      DEALERAI_APP_NAME: DealerAI Ops
      DEALERAI_ENVIRONMENT: local
      DEALERAI_LOG_LEVEL: INFO
      DEALERAI_DATABASE_URL: postgresql+psycopg://${DEALERAI_POSTGRES_USER:-dealerai}:${DEALERAI_POSTGRES_PASSWORD:-dealerai_local_password}@postgres:5432/${DEALERAI_POSTGRES_DB:-dealerai_ops}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEALERAI_POSTGRES_DB:-dealerai_ops}
      POSTGRES_USER: ${DEALERAI_POSTGRES_USER:-dealerai}
      POSTGRES_PASSWORD: ${DEALERAI_POSTGRES_PASSWORD:-dealerai_local_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
